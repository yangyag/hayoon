services:
  back:
    container_name: hayoon-back
    build:
      context: ./back
      dockerfile: Dockerfile
    environment:
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
    ports:
      - "8080:8080"
    restart: unless-stopped

  front:
    container_name: hayoon-front
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "8081:80"
    depends_on:
      - back
    restart: unless-stopped
